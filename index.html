const BEST_KEY = "quiz-energia-best";
const $ = id => document.getElementById(id);
let order = [], index = 0, points = 0, missed = [];

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  index = 0; points = 0; missed = [];
  $("result").hidden = true;
  $("quiz").hidden = false;
  show();
}

function show() {
  const item = QUESTIONS[order[index]];
  $("counter").textContent = `Pytanie ${index + 1} z ${order.length}`;
  $("points").textContent = `Punkty: ${points}`;
  $("progress").style.width = `${(index / order.length) * 100}%`;
  $("topic").textContent = item.topic;
  $("question").textContent = item.q;
  $("explain").className = "explain";
  $("explain").innerHTML = "";
  $("next").hidden = true;
  const box = $("options");
  box.innerHTML = "";
  // a[0] is the right answer; the options are shown in random order
  shuffle(item.a.map((text, i) => ({ text, right: i === 0 }))).forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    b.dataset.right = opt.right ? "1" : "";
    b.innerHTML = `<span class="key">${"ABCD"[i]}</span><span></span>`;
    b.lastChild.textContent = opt.text;
    b.addEventListener("click", () => answer(b, item));
    box.appendChild(b);
  });
  box.firstChild.focus({ preventScroll: true });
}

function answer(chosen, item) {
  const buttons = [...$("options").children];
  const right = chosen.dataset.right === "1";
  buttons.forEach(b => {
    b.disabled = true;
    if (b.dataset.right) b.classList.add("correct");
  });
  if (right) points++;
  else {
    chosen.classList.add("wrong");
    missed.push(item);
  }
  $("points").textContent = `Punkty: ${points}`;
  const ex = $("explain");
  ex.innerHTML = right ? '<strong class="ok">Dobrze.</strong> ' : '<strong class="no">Nie tym razem.</strong> ';
  ex.appendChild(document.createTextNode(item.why));
  ex.classList.add("show");
  const next = $("next");
  next.textContent = index + 1 < order.length ? "Dalej" : "Zobacz wynik";
  next.hidden = false;
  next.focus({ preventScroll: true });
}

function finish() {
  $("quiz").hidden = true;
  $("result").hidden = false;
  const total = order.length;
  const share = points / total;
  $("score").textContent = `${points} / ${total}`;
  $("verdict").textContent =
    share === 1 ? "Komplet. Znasz automatykę lepiej niż ona sama." :
    share >= 0.8 ? "Bardzo dobrze. Kilka szczegółów do odświeżenia poniżej." :
    share >= 0.5 ? "Nieźle. Przejrzyj pytania, które sprawiły kłopot." :
    "Warto jeszcze raz przeczytać dokument. Poniżej poprawne odpowiedzi.";
  const box = $("missed");
  box.innerHTML = "";
  if (missed.length) {
    const ul = document.createElement("ul");
    ul.className = "review";
    missed.forEach(item => {
      const li = document.createElement("li");
      li.innerHTML = '<div class="q"></div><div class="a"></div>';
      li.firstChild.textContent = item.q;
      li.lastChild.textContent = "Poprawnie: " + item.a[0];
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }
  let best = 0;
  try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) {}
  if (points > best) {
    best = points;
    try { localStorage.setItem(BEST_KEY, String(points)); } catch (e) {}
  }
  $("best").textContent = `Twój najlepszy wynik na tym urządzeniu: ${best} / ${total}`;
  $("again").focus({ preventScroll: true });
}

$("next").addEventListener("click", () => {
  index++;
  if (index < order.length) show(); else finish();
});
$("again").addEventListener("click", start);
document.addEventListener("keydown", e => {
  if ($("quiz").hidden) return;
  const k = e.key.toUpperCase();
  const i = "ABCD".indexOf(k);
  const opts = [...$("options").children];
  if (i >= 0 && opts[i] && !opts[i].disabled) opts[i].click();
  else if (k === "ENTER" && !$("next").hidden && document.activeElement !== $("next")) $("next").click();
});
start();
</script>
</body>
</html>
